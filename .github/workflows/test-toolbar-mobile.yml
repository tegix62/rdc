name: Test the phone toolbar

# No orphaned control, and the toolbar does not eat the screen.
# See scripts/test-toolbar-mobile.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'
  push:
    paths:
      - 'scripts/test-toolbar-mobile.mjs'
      - 'src/styles/global.css'
      - '.github/workflows/test-toolbar-mobile.yml'

jobs:
  toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # A push to src/ starts a preview deploy at the same moment, so without
      # this the test measures the PREVIOUS build.
      - run: sleep 150
      - run: |
          set -o pipefail
          node scripts/test-toolbar-mobile.mjs "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" | tee /tmp/toolbar.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Phone toolbar'
            echo ''
            echo '```'
            cat /tmp/toolbar.txt 2>/dev/null || echo '(the test did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
