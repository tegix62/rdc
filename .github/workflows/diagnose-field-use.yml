# Which Studio fields hold anything. See scripts/diagnose-field-use.mjs.
# By hand only; reads documents, downloads no pictures.
name: Diagnose field use

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/diagnose-field-use.mjs 2>&1 | tee use.txt
          { echo '## Field use'; echo '```'; cat use.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
