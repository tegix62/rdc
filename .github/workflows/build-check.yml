name: Build check

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
