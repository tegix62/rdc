name: Trace the pieces' shapes

# Each tile picture's outline and visual weight, for the lands engine
# (scripts/trace-shapes.mjs). Only pictures not traced yet are fetched, each
# once at 48px; the result is committed to src/data/shapes.json so the build
# downloads nothing. By hand only - never on a schedule.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/trace-shapes.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Commit the shapes if any are new
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/shapes.json
          if git diff --cached --quiet; then echo "no new shapes"; exit 0; fi
          git commit -qm "Shapes: trace the new pieces' outlines and weights"
          git push origin HEAD:main
