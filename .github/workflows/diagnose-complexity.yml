# How busy each All-view piece is. See scripts/diagnose-complexity.mjs.
# By hand only; reads documents, downloads no pictures.
name: Diagnose complexity

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/diagnose-complexity.mjs 2>&1 | tee complexity.txt
          { echo '## Complexity'; echo '```'; cat complexity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
