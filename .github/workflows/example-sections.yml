name: Populate example case study sections

on:
  workflow_dispatch: {}

jobs:
  populate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run example-sections
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
