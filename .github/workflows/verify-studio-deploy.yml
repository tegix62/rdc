name: Verify Studio deploy

# The deploy job's own check is `curl -o /dev/null -w %{http_code}`, which
# says the Studio answers, not that it answers with what we deployed. This
# one reads the JavaScript being served and looks for schema changes by
# name, so "deployed" and "reachable" stop being the same green tick.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-studio-deploy.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
