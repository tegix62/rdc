name: Build check

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # A malformed srcset still renders the image - the browser just falls
      # back to src and quietly stops being responsive - so this can't be
      # caught by looking at the site.
      - run: npm run test:images
      - run: npm run build
