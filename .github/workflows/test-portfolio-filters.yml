name: Test the portfolio category filters

# Clicks the real buttons on the deployed site. "The category buttons don't
# work" has been reported twice, so this exercises them instead of reasoning
# about the markup.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'
  push:
    paths:
      - 'scripts/test-portfolio-filters.mjs'
      - '.github/workflows/test-portfolio-filters.yml'
      - 'src/pages/portfolio.astro'

jobs:
  test:
    runs-on: ubuntu-latest
    # No timeout means GitHub's 360-minute default. test-media-row-slots hung
    # for four hours on a single stalled image before anyone noticed it had
    # never reported, so every browser check and audit now fails loudly rather
    # than sitting mute for most of a day.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # Give the deploy that this push also triggered time to go live, so the
      # test isn't run against the previous build.
      - run: sleep 150
      - run: node scripts/test-portfolio-filters.mjs "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}/portfolio"
      # The column count is JavaScript, so it appears in no stylesheet and no
      # CSS diff shows it changing. Four widths, four branches.
      - run: node scripts/test-portfolio-columns.mjs
