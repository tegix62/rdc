name: Diagnose tile treatment

# How many tiles would gain air if an explicitly-set "Logomark" treatment
# started applying in the normal grid, not just in ink mode - and which
# pieces they are.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-tile-treatment.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
