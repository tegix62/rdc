name: SEO copy audit

# What is still worth WRITING, page by page - the half of SEO no code can do.
#
# Separate from Build check on purpose. That workflow is a gate: it fails when
# the head is malformed. This one never fails; it reports where each description
# came from, so "assembled from three database fields" is visible somewhere
# other than a search result three months from now.
#
# Read-only. Changes nothing in Sanity.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/audit-seo.mjs'
      - 'src/lib/meta.ts'
      - '.github/workflows/audit-seo.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    # No timeout means GitHub's 360-minute default. test-media-row-slots hung
    # for four hours on a single stalled image before anyone noticed it had
    # never reported, so every browser check and audit now fails loudly rather
    # than sitting mute for most of a day.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/audit-seo.mjs 2>&1 | tee seo-audit.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## SEO copy audit"
            echo ""
            echo '```'
            cat seo-audit.txt 2>/dev/null || echo '(the audit did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
