name: Build check

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/build-check.yml'
      # scripts/ too, because this workflow RUNS scripts - test-images.mjs,
      # test-image-guards.mjs, and build-overlay.mjs via `npm run build` - and
      # none of them were in this list. So a commit that changed only a test
      # script did not re-run the check that executes it: the fix for a red build
      # check silently never ran, and the branch sat looking unverified because
      # it genuinely was.
      #
      # Deliberately the whole directory rather than the three names. Listing
      # them precisely is what produced this bug - a step gets added, its script
      # is not added here, and the gap stays invisible until something unrelated
      # triggers the workflow. A few extra runs when a diagnose script changes is
      # a much cheaper mistake than a check that quietly does not fire.
      - 'scripts/**'
      # The parked contact form - the page and the two Cloudflare Functions,
      # moved out of src/pages/ and functions/ so neither deploys while
      # enquiries would land in a public-read dataset. Its test suites still
      # run on every change, which is the point of parking it rather than
      # deleting it: the code stays proven, so bringing it back is a move
      # rather than a rewrite. Untested parked code rots silently and is worth
      # nothing when you reach for it.
      - 'parked/**'
      # Copied VERBATIM into dist/ by Astro's build - _headers, favicon.svg,
      # the vendor scripts. A change here reaches production exactly as
      # written, with no build step to catch a mistake in it, which is the
      # strongest possible reason for it to be covered by this same gate
      # rather than the weakest.
      - 'public/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # An unbalanced /* in a stylesheet is still VALID CSS - it just runs on
      # until the next */ and silently eats every rule in between. A parser
      # reports no error, the build succeeds, and the only symptom is styling
      # that quietly stopped applying. It happened while moving the ink-mode
      # chrome out: a leftover comment fragment swallowed the footer's
      # tap-target rules, and esbuild parsed the result without complaint.
      - name: No stylesheet comment eats the rules after it
        run: |
          set -euo pipefail
          fail=0
          for f in $(find src -name '*.css'); do
            open=$(grep -o '/\*' "$f" | wc -l)
            close=$(grep -o '\*/' "$f" | wc -l)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::$open '/*' vs $close '*/' - a comment is swallowing rules"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "comments balanced in every stylesheet"

      # A malformed srcset still renders the image - the browser just falls
      # back to src and quietly stops being responsive - so this can't be
      # caught by looking at the site.
      - run: npm run test:images

      # An image field saved with no file attached used to throw inside urlFor
      # and take all 21 pages down with it - twice. Every call site now goes
      # through the guarded imageUrl(), and this asserts both that the guard
      # works and that nothing has gone back to calling the raw builder. Runs
      # before the build, because it is the build this protects.
      - run: node scripts/test-image-guards.mjs

      # The <head> strings and the post dates. Nothing on the page shows whether
      # these came out right - a <title> reading "Rumeau Design Co | Rumeau
      # Design Co", or 13 project pages sharing one meta description, looks
      # completely normal in review and turns up months later in a search
      # result. Pure logic, no network, so it costs a second.
      - run: node scripts/test-meta.mjs

      # Keeps the built-HTML gate below honest. It found two bugs in that gate
      # in its first minutes: a decode bug that failed every correct og:image,
      # and a check that flagged a pipe in og:title when the defect is restating
      # the site name. A gate that fails on correct output gets switched off, and
      # then it guards nothing. Needs no dist, so it runs before the build.
      - run: node scripts/test-head-selfcheck.mjs

      # The homepage grid's row arithmetic. Its only symptom when wrong is a
      # homepage that looks slightly ragged, which nobody files a bug for - they
      # just come away thinking the site is a bit amateur.
      - run: node scripts/test-peek-grid.mjs

      # The budget slider's clamp/snap/format arithmetic - the one function
      # standing between a dragged handle and a number written into Sanity, and
      # it runs on both the client and functions/api/contact.ts. Wrong here is
      # wrong in both places at once, in agreement with each other.
      - run: node scripts/test-budget.mjs

      # /contact's server-side validation - the check that matters regardless
      # of what a browser's `required` attribute already caught, since nothing
      # stops a POST built by hand from skipping the browser entirely.
      - run: node scripts/test-contact-validation.mjs

      # The step-navigation and slider wiring in src/lib/contactForm.ts,
      # against a real DOM via jsdom - not a read of the source, an actual
      # click-Next/drag-the-slider run of the code the browser will execute.
      - run: node scripts/test-contact-form.mjs

      # functions/api/contact.ts itself, as a real Request -> Response round
      # trip with fetch stubbed - proves the honeypot silently short-circuits
      # everything downstream, a failed Turnstile check never reaches Sanity,
      # and a Resend outage does not undo an already-successful Sanity write.
      - run: node scripts/test-contact-function.mjs

      # The allow-list behind /api/form-progress (drop-off tracking) - the
      # ONLY defence that endpoint has, since a vanity step counter does not
      # warrant Turnstile. Caught a real bug on its first run: `"x" in {}` is
      # true in JavaScript for every name Object.prototype defines, so a
      # plain-object allow-list would have accepted `form=__proto__` as a
      # "known form" purely because that name exists on the prototype chain.
      - run: node scripts/test-form-funnel-validation.mjs

      # functions/api/form-progress.ts itself, same real-Request approach as
      # test-contact-function.mjs above - proves a valid ping increments
      # exactly the one field a given step should, and a rejected ping
      # (unknown form, out-of-range step, a prototype-chain name) never
      # reaches Sanity at all.
      - run: node scripts/test-form-progress-function.mjs

      - run: npm run build

      # test-meta proves the composition functions are right; it cannot prove the
      # templates call them. Those are different failures, and the second is the
      # one that shipped - og:image was correct on the two templates that passed
      # it and simply absent from the other nine pages. So this reads the built
      # HTML and checks every page for a title, a distinct description, an
      # og:image, a canonical, one <h1> and a skip link.
      #
      # After the build on purpose: dist/ has to exist, and the build is where
      # the real Sanity content enters.
      - run: node scripts/test-head.mjs

      # public/_headers, checked against the BUILT copy in dist/ - the cache
      # rules PageSpeed's "efficient cache lifetimes" finding asked for.
      # Wrong in one direction (HTML cached too long) means visitors see
      # stale content after an auto-deploy; wrong the other way (build
      # assets not cached) is the 158 KiB this exists to stop re-downloading.
      - run: node scripts/test-headers.mjs

      # docs/launch.md is the one document followed under time pressure, on the
      # day the site is half-moved and nothing can be assumed to work. It told
      # Chris to open /sitemap-index.xml and then to submit that URL to Search
      # Console; nothing has ever served it. A wrong URL there does not read as a
      # typo, it reads as "the deploy is broken" - and the Search Console half had
      # no symptom at all, since a sitemap that 404s is simply never read.
      - run: node scripts/test-launch-doc.mjs

      # Nothing on the site may load from Webflow. Checked against the BUILT
      # output rather than the source, because that is the only place Sanity's
      # content and these templates exist together: an image URL pasted into
      # Studio months ago is invisible to every source-level grep, and renders
      # perfectly right up until the Webflow plan lapses and it 404s. Chris is
      # cancelling that subscription, so this is the difference between a clean
      # exit and a case study full of broken images.
      - run: node scripts/check-webflow-independence.mjs dist

      # public/_redirects is the only thing keeping the old Webflow URLs alive
      # after cutover, and nothing tied it to the content. Case studies have gone
      # from 13 to 5 over this project; any deletion can orphan a redirect
      # silently, and a 301 to a 404 is worse than no redirect - it tells a
      # crawler the page moved permanently to a dead end, throwing away the
      # ranking the redirect exists to pass on. The symptom would only appear
      # after DNS moves, on exactly the URLs that used to rank.
      - run: node scripts/test-redirects.mjs
