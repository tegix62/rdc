# A picks board in a browser, with blank pictures. See scripts/test-picks.mjs.
name: Test picks

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures
      # (scripts/lib/test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/test-picks.mjs "$BASE" | tee /tmp/picks.txt
        env:
          BASE: ${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          { echo '## Picks'; echo '```'; cat /tmp/picks.txt 2>/dev/null || echo '(the test did not run)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
