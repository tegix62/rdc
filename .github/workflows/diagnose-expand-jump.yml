name: Diagnose expand jump

# How far a tile travels horizontally when clicked, grouped by its starting
# column. See scripts/diagnose-expand-jump.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to measure'
        default: 'https://rumeaudesign.co'
      sample:
        description: 'How many tiles to click'
        default: '14'

jobs:
  jump:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/diagnose-expand-jump.mjs \
            "${{ inputs.base_url || 'https://rumeaudesign.co' }}" \
            "${{ inputs.sample || '14' }}" | tee /tmp/jump.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Expand jump'
            echo ''
            echo '```'
            cat /tmp/jump.txt 2>/dev/null || echo '(the check did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
