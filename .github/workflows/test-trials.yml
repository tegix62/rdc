name: Test the preview trials

# Museum labels and the lifted piece on the Portfolio gather, and "See it
# at actual size" on /collage, against the preview. Pictures go to the
# throwaway `shots` branch.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/test-trials.mjs "$BASE" /tmp/trial-shots | tee /tmp/trials.txt
        env:
          BASE: ${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}
      - name: Push the pictures to the shots branch
        if: always()
        run: |
          [ -d /tmp/trial-shots ] || exit 0
          cp /tmp/trials.txt /tmp/trial-shots/report.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan shots
          git rm -rfq .
          cp /tmp/trial-shots/*.* .
          git add -- report.txt $(ls *.png *.webm 2>/dev/null)
          git commit -qm "Trial pictures"
          git push -f origin shots
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Preview trials'
            echo ''
            echo '```'
            cat /tmp/trials.txt 2>/dev/null || echo '(the test did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
