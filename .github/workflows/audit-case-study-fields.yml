name: Audit case study fields

# Which fields on a case study are actually used, so the Project page tab can
# be reorganised around evidence rather than around which fields Chris
# happens to remember using.
#
# See the header of scripts/audit-case-study-fields.mjs.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/audit-case-study-fields.mjs | tee /tmp/fields.txt
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Case study field usage'
            echo ''
            echo '```'
            cat /tmp/fields.txt 2>/dev/null || echo '(the audit did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
