name: Trace constellation

# Emit the constellation as an SVG schematic so its shape can be looked at.
# See scripts/trace-constellation.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to measure'
        default: 'https://preview.rumeau-design-co.pages.dev'
      width:
        description: 'Viewport width'
        default: '1440'
      height:
        description: 'Viewport height'
        default: '2400'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/trace-constellation.mjs \
            "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" \
            "${{ inputs.width || '1440' }}" \
            "${{ inputs.height || '2400' }}" | tee /tmp/trace.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Constellation trace'
            echo ''
            echo '```'
            cat /tmp/trace.txt 2>/dev/null || echo '(the measurement did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
