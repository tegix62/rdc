name: Diagnose piece parents

# Which grid items are parented to another grid item rather than to a case
# study. See scripts/diagnose-piece-parents.mjs.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/diagnose-piece-parents.mjs | tee /tmp/parents.txt
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Piece parents'
            echo ''
            echo '```'
            cat /tmp/parents.txt 2>/dev/null || echo '(the diagnosis did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
