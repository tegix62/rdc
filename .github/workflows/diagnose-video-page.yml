# What is on the video page. See scripts/diagnose-video-page.mjs.
# By hand only; reads documents, downloads no pictures.
name: Diagnose video page

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/diagnose-video-page.mjs 2>&1 | tee video.txt
          { echo '## Video page'; echo '```'; cat video.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
