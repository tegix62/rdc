# The sketches in Sanity. See scripts/diagnose-sketches.mjs.
# By hand only; reads documents, downloads no pictures.
name: Diagnose sketches

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/diagnose-sketches.mjs 2>&1 | tee sketches.txt
          { echo '## Sketches'; echo '```'; cat sketches.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
