name: Deploy Sanity Studio

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before deploying, not after. The schema now leans on tabs, collapsed
      # fieldsets and per-field `hidden` predicates, and every one of those is a
      # reference that can dangle - a field naming a fieldset its parent never
      # declares is valid JavaScript and a broken Studio. Nothing else in CI
      # loads the schema, so without this the first sign of trouble would be
      # Chris opening Studio and finding a document he cannot edit.
      - name: Schema is internally consistent
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          node scripts/test-schema-shape.mjs

      - run: npm install
      - run: npx sanity deploy --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          # Which site the Presentation tab previews. Defaults to the deployed
          # preview (see sanity.config.ts); override with the PREVIEW_SITE_URL
          # repository variable if that address ever changes.
          SANITY_STUDIO_PREVIEW_URL: ${{ vars.PREVIEW_SITE_URL }}
      # `sanity deploy` can exit 0 even when it failed internally (e.g. a
      # token without the deployStudio grant), so verify the studio is
      # actually reachable before calling this step green.
      - run: |
          code=$(curl -sSL -o /dev/null -w "%{http_code}" https://rumeau-design-co.sanity.studio)
          echo "studio responded with HTTP $code"
          test "$code" = "200"
