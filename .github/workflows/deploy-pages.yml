name: Deploy to Cloudflare Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/deploy-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # This deployment is a preview/staging site - the real
          # rumeaudesign.co is still served by Webflow - so it's the right
          # place to turn click-to-edit on. Set this to false (or drop it)
          # before pointing a real domain at this build: it embeds invisible
          # markers in page text that visitors have no use for.
          PUBLIC_SANITY_VISUAL_EDITING: 'true'
      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@3 pages project create rumeau-design-co --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rumeau-design-co
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
