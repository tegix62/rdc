name: Migrate Webflow content to Sanity

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'studio/migration/**'
      - '.github/workflows/migrate-content.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run migrate
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
