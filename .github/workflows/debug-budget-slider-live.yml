name: Debug - budget slider on the live site

# One-off diagnostic, not a permanent check. See
# scripts/debug-budget-slider-live.mjs for why this exists: check-live output
# confirmed the fixed CSS rule TEXT ships in the stylesheet, but Chris still
# saw the numbers overlapping the track on the real page, so this renders the
# real page with a real browser and measures the real boxes instead of
# grepping source.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/debug-budget-slider-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-slider-live
          path: budget-slider-live.png
          if-no-files-found: ignore
