name: Deploy to production

# The build that serves the real domain. Live since 12 August 2026.
#
# Three ways in, and only one of them cannot publish:
#
#   workflow_dispatch     builds, and publishes only if the box is ticked
#   repository_dispatch   a publish in Sanity Studio. Always publishes.
#   push                  the gate's own files. NEVER publishes.
#
# Dispatching without ticking publish is still the cheap, useful thing: it
# builds the real production bundle and puts it through
# scripts/check-production-build.mjs without anything going live, so a
# production build can be proven correct any number of times.
#
# This file used to say pushing must never trigger it because "the site is not
# launched yet". It is launched now, and the risk has changed shape: the danger
# is no longer a premature deploy, it is a live site quietly lagging behind the
# CMS - which happened within an hour of cutover. See the note on
# repository_dispatch below for what makes automating it safe, and what it
# genuinely gives up.
#
# How this build differs from the preview one (deploy-pages.yml), which is the
# whole reason the gate exists:
#
#   PUBLIC_SANITY_VISUAL_EDITING   preview: true    here: unset
#   PUBLIC_IS_PREVIEW              preview: true    here: unset
#
# Two variables. Unset means false. Neither has any visible effect on a page,
# which is exactly why they are checked by measurement rather than by reading
# this file and believing it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the production domain (off = build and verify only)'
        type: boolean
        default: false
      verify_url:
        description: 'URL to verify after publishing'
        default: 'https://rumeaudesign.co'
  # A publish in Sanity Studio deploys to the real domain.
  #
  # Added after cutover, and it is a reversal of what this file used to say -
  # that nothing should reach the real domain without a person choosing it. The
  # reasoning changed because the site went live and the workflow that was
  # protecting it started producing the opposite failure: Chris published a new
  # homepage hero, the live site silently disagreed with Studio, and the only
  # signal was him noticing.
  #
  # What makes it safe is not a person, it is the gate. Every run below still
  # goes through scripts/check-production-build.mjs BEFORE anything uploads, so
  # automating this means checked builds go live automatically rather than
  # unchecked ones. What is genuinely accepted here is different: a content
  # mistake reaches the domain in about two minutes rather than waiting for
  # someone to deploy. Sanity keeps document history, so that is revertable in
  # Studio - and the alternative was a site that quietly lagged behind its CMS
  # forever.
  #
  # Same `sanity-publish` event the preview workflow listens for, so one webhook
  # in Sanity drives both and there is no second thing to keep in sync.
  repository_dispatch:
    types: [sanity-publish]
  # GitHub only offers "Run workflow" for files that exist on the default
  # branch, so until this is merged there is no way to dispatch it - and an
  # untested launch gate is not a launch gate. This trigger covers only the
  # three files that make up the gate itself, and MUST NOT publish - see the
  # PUBLISH expression below, which is what enforces that.
  push:
    paths:
      - '.github/workflows/deploy-production.yml'
      - 'scripts/check-production-build.mjs'
      - 'scripts/test-production-check.mjs'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Whether this run publishes, decided ONCE.
    #
    # Every publishing step used to test `inputs.publish` individually. That was
    # fine while a dispatch was the only way in, and became a trap the moment a
    # second trigger existed: `inputs` is empty on anything that is not a
    # workflow_dispatch, so a Sanity publish would have built, passed the gate,
    # skipped every upload step, and reported success - a green run that deployed
    # nothing, which is the worst possible way for this to fail.
    #
    # Resolved per event:
    #   workflow_dispatch      whatever the tick box said
    #   repository_dispatch    always - a publish in Studio means publish
    #   push                   never. `inputs.publish` is empty and the event
    #                          name does not match, so this is false. That is the
    #                          property the push trigger's safety rests on.
    env:
      PUBLISH: ${{ inputs.publish || github.event_name == 'repository_dispatch' }}
      VERIFY_URL: ${{ inputs.verify_url || 'https://rumeaudesign.co' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is committed now, so this resolves to the exact
      # versions that built the site during development rather than re-resolving
      # the ^ ranges in package.json on the day. Two deploys broke that way
      # earlier in this project, and launch day is the worst possible time for a
      # transitive dependency to float.
      #
      # Still `npm install` rather than `npm ci`, deliberately. The lockfile
      # carries isotope-layout and imagesloaded at its root, left over from
      # installing them once to extract the two files now committed under
      # public/vendor - nothing depends on those packages at build time. npm ci
      # refuses to run when the lockfile and package.json disagree like that, so
      # switching today would break every workflow. The fix is to regenerate the
      # lockfile from a clean install, which needs network this sandbox does not
      # have; `npm ci` becomes correct the moment someone does that.
      - run: npm install

      # The gate is only worth what it can catch, so prove it in the same run
      # that relies on it. Builds a deliberately broken dist for every check
      # and asserts each one fails with the right name. Needs no network.
      - name: Verify the gate itself still catches things
        run: node scripts/test-production-check.mjs

      - name: Build
        run: npm run build
        env:
          # Both preview flags are absent on purpose. Do not "helpfully" add
          # them back - see the header of this file, and the gate below, which
          # will refuse the deploy if they reappear.
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Same Turnstile SITE key as the preview build - see the note there.
          # Public by design, so a repo variable rather than a secret.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # Nothing is deployed until this passes. It reads the built files rather
      # than trusting the env block above: robots.txt rules, canonical hosts,
      # the sitemap's contents, invisible stega markers in the copy, the
      # editing overlay, and whether every page is stamped with this commit.
      - name: Gate - is this actually a production build?
        run: |
          set -o pipefail
          node scripts/check-production-build.mjs \
            --dist dist \
            --origin https://rumeaudesign.co \
            --sha "$GITHUB_SHA" \
            --json production-check.json 2>&1 | tee production-check.txt

      - name: Report the gate
        if: always()
        run: |
          {
            echo '## Production build gate'
            echo ''
            echo '```'
            cat production-check.txt 2>/dev/null || echo '(the build did not get this far)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-check
          path: |
            production-check.txt
            production-check.json
          if-no-files-found: ignore

      # Everything below only runs when publishing was asked for.
      - name: Ensure the Pages project exists
        if: env.PUBLISH == 'true'
        run: npx wrangler@3 pages project create rumeau-design-co --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/pages-action@v1
        if: env.PUBLISH == 'true'
        id: pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rumeau-design-co
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `main` is the project's production branch, so this is the
          # deployment a custom domain serves. The preview workflow publishes
          # to `preview`, and the two never touch.
          branch: main

      # The gate checked files on disk. This checks what the CDN actually
      # serves, which is not the same claim: a stale deployment, a cached
      # robots.txt, or a domain pointed at the wrong branch would all sail
      # past a file check.
      - name: Verify what is live
        if: env.PUBLISH == 'true'
        run: |
          set -uo pipefail
          BASE="${{ env.VERIFY_URL }}"
          BASE="${BASE%/}"
          problems=0

          note() { echo "  $1"; }
          bad() { echo "  ✗ $1"; problems=$((problems + 1)); }

          # A brand new deployment takes a moment to become the one being
          # served, so poll for this commit rather than measuring whatever is
          # there and reporting it as this build. Three earlier audits in this
          # project measured the previous build for want of exactly this.
          stamp=""
          for attempt in 1 2 3 4 5 6 7 8; do
            stamp=$(curl -sL --max-time 20 "$BASE/" \
              | grep -o 'name="build-commit" content="[^"]*"' \
              | head -1 | sed 's/.*content="//; s/"//')
            [ "$stamp" = "$GITHUB_SHA" ] && break
            echo "attempt $attempt: live build is '${stamp:-none}', waiting for $GITHUB_SHA"
            sleep 10
          done

          if [ "$stamp" = "$GITHUB_SHA" ]; then
            note "✓ serving this commit"
          else
            bad "still serving '${stamp:-nothing}' after 80s, so everything below describes some other build"
          fi

          robots=$(curl -sL --max-time 20 "$BASE/robots.txt")
          if printf '%s' "$robots" | grep -qiE '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$'; then
            bad "robots.txt disallows the whole site"
          else
            note "✓ robots.txt allows crawling"
          fi
          if printf '%s' "$robots" | grep -qi 'Sitemap:'; then
            note "✓ robots.txt names a sitemap"
          else
            bad "robots.txt names no sitemap"
          fi

          home=$(curl -sL --max-time 20 "$BASE/")
          if printf '%s' "$home" | grep -qi 'name="robots"[^>]*noindex'; then
            bad "the homepage is noindexed"
          else
            note "✓ no noindex"
          fi
          if printf '%s' "$home" | grep -q 'rel="canonical" href="https://rumeaudesign.co/"'; then
            note "✓ canonical points at rumeaudesign.co"
          else
            bad "homepage canonical is not https://rumeaudesign.co/"
          fi

          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/sanity-visual-editing.js")
          if [ "$code" = "404" ]; then
            note "✓ the editing overlay is not served (404)"
          else
            bad "/sanity-visual-editing.js returns HTTP $code - it should not exist"
          fi

          # Same placeholder smoke test the preview deploy runs: every template
          # falls back to "Content coming soon" when its document is missing,
          # which is a healthy-looking 200 with no content behind it.
          for p in / /portfolio /about /video /collage /merchfolio /blog /privacy-policy; do
            body=$(curl -sL --max-time 20 "$BASE$p")
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$p")
            if [ "$code" != "200" ]; then
              bad "$p -> HTTP $code"
            elif printf '%s' "$body" | grep -q "Content coming soon"; then
              bad "$p -> 200 but showing the placeholder"
            fi
          done

          {
            echo ''
            echo "### Live at $BASE"
            echo ''
            if [ "$problems" -eq 0 ]; then
              echo 'Everything checked out.'
            else
              echo "**$problems problem(s)** - see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$problems" -eq 0 ]

      - name: Where it went
        if: env.PUBLISH == 'true' && always()
        run: |
          {
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo '| This deploy | ${{ steps.pages.outputs.url }} |'
            echo '| Production alias | ${{ env.VERIFY_URL }} |'
          } >> "$GITHUB_STEP_SUMMARY"
