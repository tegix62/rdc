name: Diagnose animation weight

# Read-only. Answers two questions the measurements could not: whether the
# image CDN preserves animation when it transforms a GIF, and which asset the
# homepage's 10.7 MB request actually is.
on:
  workflow_dispatch:
  push:
    paths:
      - 'studio/migration/diagnose-animations.mjs'
      - '.github/workflows/diagnose-animations.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run diagnose:animations | tee /tmp/diag.txt
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Animation weight diagnostic'
            echo ''
            echo '```'
            cat /tmp/diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .
