name: Convert animated images to video

# Manual. Transcoding is slow and writes new assets to the dataset, so it
# shouldn't fire on every push. Safe to re-run: already-converted assets are
# skipped unless "force" is ticked.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the numbers only - transcode, measure, write nothing'
        type: boolean
        default: true
      force:
        description: 'Re-convert everything, even assets already in the map'
        type: boolean
        default: false
  # A push runs the DRY RUN and nothing else.
  #
  # It used to run the real conversion. Editing this script therefore uploaded
  # new assets to the production dataset as a side effect of editing it, which
  # is not something a push should ever do - and it is the same mistake the
  # dead-field cleanup workflow was written to avoid. On a push there is no
  # `inputs.dry_run`, so the step below forces DRY_RUN=1 explicitly rather than
  # relying on an empty string being falsy.
  push:
    paths:
      - 'studio/migration/convert-animations.mjs'
      - '.github/workflows/convert-animations.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ffmpeg is NOT on the ubuntu-latest image, contrary to what the first
      # version of this workflow assumed. Install it explicitly.
      - name: Install ffmpeg
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      # Asserted without a pipe on purpose: the original check was
      # `ffmpeg -version | head -1`, and a pipeline exits with the status of
      # its LAST command, so head's success masked ffmpeg being missing
      # entirely and the run failed later instead.
      - name: Verify ffmpeg and codecs
        working-directory: .
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -encoders | grep -q libx264 || { echo "libx264 missing"; exit 1; }
          ffmpeg -hide_banner -encoders | grep -q libvpx-vp9 || { echo "libvpx-vp9 missing"; exit 1; }
      - run: npm install
      # The detector is byte-level header parsing and had a wrong-offset bug
      # that silently skipped every WebP for months. Cheap to assert, so assert
      # it before spending ffmpeg time or touching the dataset.
      - name: Animated-WebP detector
        working-directory: .
        run: node scripts/test-animated-webp.mjs
      - run: npm run convert:animations
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          # Dry run unless a dispatch explicitly says otherwise. A push has no
          # inputs at all, so this resolves to '1' and the run cannot write.
          DRY_RUN: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run) && '1' || '0' }}
