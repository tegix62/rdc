name: Diagnose toolbar

# Why Shuffle and Gather do nothing. Reports, does not assert.
# See scripts/diagnose-toolbar.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'
  push:
    paths:
      - 'scripts/diagnose-toolbar.mjs'
      - '.github/workflows/diagnose-toolbar.yml'

jobs:
  toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # A push to src/ starts a preview deploy at the same moment, so without
      # this the test measures the PREVIOUS build.
      - run: |
          set -o pipefail
          node scripts/diagnose-toolbar.mjs "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" | tee /tmp/toolbar.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Toolbar'
            echo ''
            echo '```'
            cat /tmp/toolbar.txt 2>/dev/null || echo '(the test did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
