name: Diagnose full-resolution scans

# Which collages have a Full-resolution scan, its size, and how fast the
# image CDN serves one magnifier patch from it.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/diagnose-full-scan.mjs | tee /tmp/scan.txt
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Full-resolution scans'
            echo ''
            echo '```'
            cat /tmp/scan.txt 2>/dev/null || echo '(the script did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
