name: Find an uploaded picture

# Looks for a picture by a word in its file name, in Sanity and in the R2
# bucket (outside the site's own copies). Prints ids and keys only.

on:
  workflow_dispatch:
    inputs:
      words:
        description: 'Words to look for, space-separated'
        default: 'selfie'

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save aws4fetch@1.0.20
      - run: node scripts/find-asset.mjs ${{ inputs.words }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
