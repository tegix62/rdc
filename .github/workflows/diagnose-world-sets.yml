# Why does a project come apart on the world page? See scripts/diagnose-world-sets.mjs.
# By hand only; test browsers get blank pictures, so no pictures are downloaded.
name: Diagnose world sets

on:
  workflow_dispatch:
    inputs:
      term:
        description: 'Part of a title or project address'
        default: 'hug'
      dump:
        description: 'Print the page data too (for tuning offline)'
        type: boolean
        default: false
      base_url:
        description: 'Site'
        default: 'https://preview.rumeau-design-co.pages.dev'

permissions:
  contents: write

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/diagnose-world-sets.mjs "$TERM_IN" "$BASE" 2>&1 | tee sets.txt
          { echo '## World sets'; echo '```'; cat sets.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          TERM_IN: ${{ inputs.term }}
          DUMP_DATA: ${{ inputs.dump && '/tmp/world-data.json' || '' }}
          BASE: ${{ inputs.base_url }}
      - name: Push the page data to the world-data branch
        if: ${{ inputs.dump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan world-data
          git rm -rfq .
          cp /tmp/world-data.json .
          git add world-data.json
          git commit -qm "World page data from ${BASE}"
          git push -f origin world-data
        env:
          BASE: ${{ inputs.base_url }}
