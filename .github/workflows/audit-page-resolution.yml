name: Audit page resolution

# Every image on a page: painted size, served size, uploaded size, and which
# of the three causes of softness applies. See scripts/audit-page-resolution.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to audit'
        default: 'https://rumeaudesign.co'
      path:
        description: 'Page to audit'
        default: '/video'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/audit-page-resolution.mjs \
            "${{ inputs.base_url || 'https://rumeaudesign.co' }}" \
            "${{ inputs.path || '/video' }}" | tee /tmp/res.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Page resolution'
            echo ''
            echo '```'
            cat /tmp/res.txt 2>/dev/null || echo '(the audit did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
