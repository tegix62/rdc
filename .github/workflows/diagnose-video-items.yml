# What the Video items lists. See scripts/diagnose-video-items.mjs.
# By hand only; reads documents, downloads no pictures.
name: Diagnose collage page

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/diagnose-video-items.mjs 2>&1 | tee videos.txt
          { echo '## Video items'; echo '```'; cat videos.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
