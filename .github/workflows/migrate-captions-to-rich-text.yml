name: Migrate captions to rich text

# Converts every Page Builder caption (Media Row images and videos, and the
# standalone Video block) from a plain string to portable text, so it can carry
# a link. Dry run unless "apply" is ticked - the dry run prints each caption it
# would write and, importantly, every caption it is NOT converting.
#
# Order matters and is not enforceable from here:
#   1. the SITE must already render both shapes, and be LIVE in production
#      (src/lib/caption.ts) - the previous site prints an array as
#      "[object Object]" under every converted picture
#   2. run this
#   3. only then change the schema
# See the header of scripts/migrate-captions-to-rich-text.mjs.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes (off = dry run)'
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/migrate-captions-to-rich-text.mjs | tee /tmp/migrate.txt
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Captions → rich text'
            echo ''
            echo '```'
            cat /tmp/migrate.txt 2>/dev/null || echo '(the migration did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
