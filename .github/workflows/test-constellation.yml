name: Test constellation

# Expanding a tile lights its project and drops the rest back - and refuses
# to for a project too small to read as a set, or a standalone piece.
# See scripts/test-constellation.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'
  push:
    paths:
      - 'scripts/test-constellation.mjs'
      - '.github/workflows/test-constellation.yml'

jobs:
  constellation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # A push to src/ starts a preview deploy at the same moment, so without
      # this the test measures the PREVIOUS build.
      - run: sleep 150
      - run: |
          set -o pipefail
          node scripts/test-constellation.mjs "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" | tee /tmp/con.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Constellation'
            echo ''
            echo '```'
            cat /tmp/con.txt 2>/dev/null || echo '(the test did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
