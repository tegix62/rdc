name: Verify Studio deploy

# The deploy job's own check is `curl -o /dev/null -w %{http_code}`, which
# says the Studio answers, not that it answers with what we deployed. This
# one reads the JavaScript being served and looks for schema changes by
# name, so "deployed" and "reachable" stop being the same green tick.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-studio-deploy.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      # A check nobody has seen fail is a check nobody knows the meaning of.
      # Point it at a local "build" that is plainly not what is deployed and
      # require it to say so - the same comparison deploy-studio now relies
      # on, exercised in the one direction that matters.
      - name: The comparison can fail
        run: |
          mkdir -p /tmp/wrong-dist
          echo '{"schema":"not what is deployed"}' > /tmp/wrong-dist/000.create-schema.json
          if STUDIO_DIST=/tmp/wrong-dist node scripts/verify-studio-deploy.mjs > /tmp/control.txt 2>&1; then
            echo "CONTROL FAILED: a schema that is not the deployed one passed."
            cat /tmp/control.txt
            exit 1
          fi
          echo "control held: a mismatch is reported as one"
          tail -4 /tmp/control.txt
