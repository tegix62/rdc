name: Test gather

# Gather pulls a project's pieces to the tile you clicked, and leaves the
# visitor where they were on the page. See scripts/test-gather.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://preview.rumeau-design-co.pages.dev'
  push:
    paths:
      - 'scripts/test-gather.mjs'
      - 'src/pages/portfolio.astro'
      - '.github/workflows/test-gather.yml'

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # First: the test browser answers picture requests itself (no Sanity
      # bandwidth). If that ever breaks, stop before touching the site.
      - run: node scripts/test-test-images-off.mjs
      # A push to src/ starts a preview deploy at the same moment, so without
      # this the test measures the PREVIOUS build.
      - run: sleep 150
      - run: |
          set -o pipefail
          node scripts/test-gather.mjs "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" | tee /tmp/gather.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Gather'
            echo ''
            echo '```'
            cat /tmp/gather.txt 2>/dev/null || echo '(the test did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
