name: Diagnose duplicate title

# Every document whose title contains a phrase, drafts included. See
# scripts/diagnose-duplicate-title.mjs.

on:
  workflow_dispatch:
    inputs:
      phrase:
        description: 'Part of the title'
        default: 'More Kilos Photography'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/diagnose-duplicate-title.mjs "$PHRASE" | tee /tmp/dup.txt
        env:
          PHRASE: ${{ inputs.phrase || 'More Kilos Photography' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Duplicate title'
            echo ''
            echo '```'
            cat /tmp/dup.txt 2>/dev/null || echo '(the diagnosis did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

