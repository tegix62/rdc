name: Diagnose collages

# What the collage artwork is as files, and whether it holds enough pixels
# for a full-bleed scrolling treatment. See scripts/diagnose-collages.mjs.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-collages.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
