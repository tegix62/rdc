name: Diagnose gather scroll

# Where a gathered set lands on a phone, and how much of it you can see
# without moving. See scripts/diagnose-gather-scroll.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to measure'
        default: 'https://preview.rumeau-design-co.pages.dev'
      width:
        description: 'Viewport width'
        default: '390'
      height:
        description: 'Viewport height (664 is a phone with Safari chrome on screen)'
        default: '664'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/diagnose-gather-scroll.mjs \
            "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" \
            "${{ inputs.width || '390' }}" \
            "${{ inputs.height || '664' }}" | tee /tmp/gather.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Gather, on a phone'
            echo ''
            echo '```'
            cat /tmp/gather.txt 2>/dev/null || echo '(the measurement did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
