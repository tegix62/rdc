name: Measure row width

# How wide a Media Row is next to its text column, on the video page and on a
# case study, at several window widths. See scripts/measure-row-width.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to measure'
        default: 'https://preview.rumeau-design-co.pages.dev'
      paths:
        description: 'Comma-separated paths'
        default: '/video,/work/two-point-oh'
      widths:
        description: 'Comma-separated viewport widths'
        default: '1440,1920,1100,390'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/measure-row-width.mjs \
            "${{ inputs.base_url || 'https://preview.rumeau-design-co.pages.dev' }}" \
            "${{ inputs.paths || '/video,/work/two-point-oh' }}" \
            "${{ inputs.widths || '1440,1920,1100,390' }}" | tee /tmp/rows.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Media Row width'
            echo ''
            echo '```'
            cat /tmp/rows.txt 2>/dev/null || echo '(the measurement did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
