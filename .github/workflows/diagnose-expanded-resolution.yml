name: Diagnose expanded tile resolution

# What resolution a Portfolio tile is served before and after it is clicked,
# at 1x and 2x. See the header of scripts/diagnose-expanded-resolution.mjs.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to measure'
        default: 'https://rumeaudesign.co'
      match:
        description: 'Match a tile by part of its title'
        default: 'Luna Tee'

jobs:
  resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # From here on, test browsers never download the site's pictures:
      # each is answered with a blank of the same shape (scripts/lib/
      # test-images-off.mjs). Set after checkout, which runs before the file exists.
      - run: echo "NODE_OPTIONS=--import=$GITHUB_WORKSPACE/scripts/lib/test-images-off.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/diagnose-expanded-resolution.mjs \
            "${{ inputs.base_url || 'https://rumeaudesign.co' }}" \
            "${{ inputs.match || 'Luna Tee' }}" | tee /tmp/res.txt
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Expanded tile resolution'
            echo ''
            echo '```'
            cat /tmp/res.txt 2>/dev/null || echo '(the check did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
