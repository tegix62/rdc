name: Set homepage grid

# siteSettings.featuredWork is empty, so the homepage grid falls back to
# most-recently-added. This picks four case studies that make one clean row -
# three of which the testimonial cards further down the page already quote.
#
# Dry by default; only writes when run from the Actions tab with "set" ticked.

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Actually set it (unticked = show what would change)'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/set-homepage-grid.mjs'
      - '.github/workflows/set-homepage-grid.yml'

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show the change, and apply only if asked
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SET: ${{ inputs.set && 'yes' || '' }}
        run: |
          set -o pipefail
          node scripts/set-homepage-grid.mjs 2>&1 | tee homepage-grid.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## Homepage grid"
            echo ""
            echo '```'
            cat homepage-grid.txt 2>/dev/null || echo '(the script did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
