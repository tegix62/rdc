# Does Sanity's CDN honour the build's Range requests? See
# scripts/check-range.mjs. By hand; reads headers only.
name: Check Sanity range requests

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-range.mjs | tee range.txt
