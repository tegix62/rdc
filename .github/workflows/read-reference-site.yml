# Another designer's site, read for reference: its structure and words to
# the log, nothing kept. Pictures of someone else's work are not stored
# anywhere (Chris: "don't keep anything in that regards if you don't have
# to"). Honours the site's robots.txt. See scripts/read-reference-site.mjs.
name: Read a reference site

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Start page'
        required: true
      max_pages:
        description: 'Pages to read'
        default: '8'
      hint:
        description: 'Read pages whose address matches this first (a regex)'
        default: 'merch|work|project|portfolio|shirt|apparel'
      robots_only:
        description: 'Only read the site robots.txt and stop'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Read
        env:
          URL_IN: ${{ inputs.url }}
          MAX_IN: ${{ inputs.max_pages }}
          HINT_IN: ${{ inputs.hint }}
          ROBOTS_ONLY: ${{ inputs.robots_only && '1' || '' }}
        run: node scripts/read-reference-site.mjs "$URL_IN" /tmp/reference "$MAX_IN" "$HINT_IN" 2>&1 | tee /tmp/reference.txt
