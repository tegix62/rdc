name: Check the live site

# Phase 3 of docs/launch.md, run against the real domain rather than by eye.
#
# Two of these have no visible symptom - a robots.txt saying Disallow: / and a
# canonical pointing at the preview host both leave a site that looks perfect and
# is invisible to Google. One more looks like success when it is broken: a
# www -> apex redirect that fires but drops the path.
#
# Read-only. Nothing but GETs.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to check'
        type: string
        default: 'https://rumeaudesign.co'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        run: |
          set -o pipefail
          node scripts/check-live.mjs "${{ inputs.url }}" 2>&1 | tee live.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## Live site check"
            echo ""
            echo '```'
            cat live.txt 2>/dev/null || echo '(the check did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
